appId: com.jasper.avatar
productName: Jasper AI
copyright: Copyright © 2026 Jasper Team

directories:
  output: release

files:
  - out/**/*
  - package.json
  - "!**/node_modules/**/*.map"
  - "!**/node_modules/**/{test,tests,__tests__}/**"
  - "!**/node_modules/{three,@tensorflow,@tensorflow-models}/**"

extraResources:
  - from: src/main/autonomous/scripts
    to: scripts
    filter:
      - "*.ps1"
  - from: assets/icon.ico
    to: icon.ico

win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerHeaderIcon: assets/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Jasper AI
  artifactName: Jasper-AI-Setup-${version}.${ext}

portable:
  artifactName: Jasper-AI-${version}-Portable.${ext}

publish:
  provider: generic
  url: https://github.com/sAlly-19/jasper-avatar-releases/releases/latest/download

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

